[package]
name = "tether-app"
description = "Tether a Sony A7 camera over USB: live view, shutter, download"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "tether-app"
path = "src/main.rs"

[dependencies]
camera-core = { workspace = true }
backend-sdk = { workspace = true }
eframe = "0.37"
# JPEG and PNG only: camera RAW needs the embedded preview extracted first, and
# a full RAW decoder is not worth the binary size yet. See review.rs.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }